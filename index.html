<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cycle Ledger</title>
<meta name="description" content="Monthly money cycles: split each commission across five accounts and track every dirham.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cycle Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0E13" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
button{touch-action:manipulation}
</style>
<style>
/* Layout: one-column phone ledger. Sticky top bar, fixed bottom tab bar, full-screen sheets for the cycle flows. Ink UI; colour only carries account identity and status. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F4F6F9; --sunk:#E3E7ED;
  --ink:#10141C; --ink-2:#465063; --muted:#687183; --line:#D7DCE4; --line-2:#E6E9EF;
  --primary:#10141C; --on-primary:#FFFFFF; --focus:#2a78d6;
  --c-salary:#2a78d6; --c-expense:#eb6834; --c-savings:#1baf7a; --c-charity:#eda100; --c-fun:#e87ba4;
  --good:#0ca30c; --good-ink:#0a6a0a; --good-bg:#E3F3E3;
  --warn:#fab219; --warn-ink:#7E5200; --warn-bg:#FCEFD2;
  --bad:#d03b3b; --bad-ink:#A82626; --bad-bg:#FAE2E2;
  --shadow:0 1px 2px rgba(16,20,28,.05),0 6px 18px rgba(16,20,28,.05);
  --scrim:rgba(10,14,20,.42);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px; --r-sm:11px; --nav-h:66px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B0E13; --surface:#151921; --surface-2:#1C212B; --sunk:#0F1218;
  --ink:#ECEFF4; --ink-2:#B3BBC9; --muted:#8C95A7; --line:#2A303B; --line-2:#222732;
  --primary:#ECEFF4; --on-primary:#10141C; --focus:#3987e5;
  --c-salary:#3987e5; --c-expense:#d95926; --c-savings:#199e70; --c-charity:#c98500; --c-fun:#d55181;
  --good-ink:#5BCB5B; --good-bg:#13291A; --warn-ink:#F2C14E; --warn-bg:#2E2510; --bad-ink:#F08080; --bad-bg:#351919;
  --shadow:0 1px 0 rgba(255,255,255,.03); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0E13; --surface:#151921; --surface-2:#1C212B; --sunk:#0F1218;
  --ink:#ECEFF4; --ink-2:#B3BBC9; --muted:#8C95A7; --line:#2A303B; --line-2:#222732;
  --primary:#ECEFF4; --on-primary:#10141C; --focus:#3987e5;
  --c-salary:#3987e5; --c-expense:#d95926; --c-savings:#199e70; --c-charity:#c98500; --c-fun:#d55181;
  --good-ink:#5BCB5B; --good-bg:#13291A; --warn-ink:#F2C14E; --warn-bg:#2E2510; --bad-ink:#F08080; --bad-bg:#351919;
  --shadow:0 1px 0 rgba(255,255,255,.03); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.num,.amt{font-variant-numeric:tabular-nums}
.cur{font-family:var(--f-mono);font-size:.62em;letter-spacing:.06em;color:var(--muted);vertical-align:.18em;margin-right:.3em}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:12px 10px;min-height:56px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-cycle{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.sync{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.sync.busy{background:var(--warn)}
.sync.off{background:var(--bad)}
.back{border:0;background:var(--surface);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);flex:none}
main.wrap{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;gap:14px;padding-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:var(--nav-h)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--muted);padding:6px 0}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button svg{width:22px;height:22px}
.nav .add{justify-self:center;width:52px;height:52px;border-radius:18px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;padding:0}
.nav .add svg{width:24px;height:24px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line-2);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h .link{font-size:.85rem;font-weight:600;color:var(--ink-2);background:none;border:0;padding:4px 0}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:700;font-size:2.3rem;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.big .cur{font-size:.42em;vertical-align:.5em}
.mid{font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:.85rem}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.stack{display:flex;height:12px;gap:2px;border-radius:6px;overflow:hidden;margin:14px 0 6px;background:var(--sunk)}
.stack span{display:block;height:100%;min-width:3px}
.acct-list{display:flex;flex-direction:column;margin-top:6px}
.acct-row{display:grid;grid-template-columns:12px 1fr auto 16px;align-items:center;gap:10px;padding:11px 0;border:0;border-top:1px solid var(--line-2);background:none;text-align:left;width:100%}
.acct-row:first-child{border-top:0}
.acct-row .nm{font-weight:600;min-width:0}
.acct-row .bk{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-row .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.acct-row .v small{display:block;font-weight:500;font-size:.75rem;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.chev{color:var(--muted);width:16px;height:16px}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:var(--r-sm);background:var(--warn-bg);color:var(--warn-ink);font-weight:600;font-size:.9rem;border:0;text-align:left;width:100%}
.alert svg{flex:none;width:18px;height:18px}
.alert.bad{background:var(--bad-bg);color:var(--bad-ink)}
.alert.info{background:var(--surface-2);color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.stat .eyebrow{font-size:.64rem}
.stat .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}
.check-list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.check{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border-radius:var(--r-sm);background:var(--surface-2);border:0;width:100%;text-align:left}
.check .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.check.done .box{background:var(--good);border-color:var(--good);color:#fff}
.check .t{font-weight:600;min-width:0}
.check .s{font-size:.8rem;color:var(--muted)}
.check .a{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.check.static .box{border-style:dashed}
.diff{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn-ink);margin-top:3px}
.tx-list{display:flex;flex-direction:column}
.tx{display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:center;padding:10px 0;border:0;border-top:1px solid var(--line-2);background:none;width:100%;text-align:left}
.tx:first-child{border-top:0}
.tx .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.tx .ic svg{width:17px;height:17px}
.tx .t{font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.tx .a.pos{color:var(--good-ink)}
.tx .a.neu{color:var(--ink-2)}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:.9rem}
.prog{height:8px;border-radius:5px;background:var(--sunk);overflow:hidden;margin-top:8px}
.prog span{display:block;height:100%;border-radius:5px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line-2)}
.bar-row:first-child{border-top:0}
.bar-row .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .v{font-variant-numeric:tabular-nums;font-size:.88rem;color:var(--ink-2);text-align:right;white-space:nowrap}
.bar-row .track{grid-column:1/-1;position:relative;height:8px;border-radius:5px;background:var(--sunk);margin-top:6px}
.bar-row .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar-row .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.bar-row .note{grid-column:1/-1;font-size:.75rem;font-weight:700;color:var(--bad-ink);margin-top:3px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line-2);font-size:.92rem}
.kv:first-child{border-top:0}
.kv b{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px -4px}
.section-title h2{font-size:1.02rem}
.tabs{display:flex;gap:6px;background:var(--sunk);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-weight:600;font-size:.85rem;color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.86rem;font-weight:600;display:inline-flex;align-items:center;gap:7px;max-width:100%}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.chip .dot{width:9px;height:9px;border-radius:3px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:.8rem;font-weight:600;color:var(--ink-2)}
.inp{width:100%;min-width:0;max-width:100%;display:block;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 12px;font-size:16px;line-height:20px;min-height:44px;height:44px;margin:0}
input.inp[type="date"]{-webkit-appearance:none;appearance:none;text-align:left}
input.inp[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:20px}
input.inp[type="date"]::-webkit-datetime-edit{padding:0;line-height:20px}
input.inp[type="date"]::-webkit-calendar-picker-indicator{margin:0 0 0 6px;opacity:.6}
.inp:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.inp.money{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.amount-big{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding:6px 2px}
.amount-big .cur{font-size:1rem;vertical-align:0}
.amount-big input{border:0;background:transparent;font-family:var(--f-display);font-weight:700;font-size:2.4rem;width:100%;min-width:0;letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding:0}
.amount-big input:focus{outline:none}
.amount-big:focus-within{border-color:var(--focus)}
.form{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
.acct-row.aside{border-top:1px dashed var(--line);margin-top:4px}
.acct-row.aside .v{color:var(--ink-2)}
.line-in{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2)}
.line-in:first-child{border-top:0}
.line-in .n{font-weight:600;min-width:0;display:flex;align-items:center;gap:8px}
.line-in .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line-in .n small{display:block;font-weight:500;color:var(--muted);font-size:.76rem;white-space:normal}
.x{border:0;background:var(--surface-2);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.x svg{width:14px;height:14px}
.hint{font-size:.82rem;color:var(--muted)}
.callout{background:var(--surface-2);border-radius:var(--r-sm);padding:11px 13px;font-size:.86rem;color:var(--ink-2)}
.banner{background:var(--warn-bg);color:var(--warn-ink);font-weight:600;font-size:.85rem;padding:9px 12px;border-radius:var(--r-sm);display:flex;align-items:center;gap:10px;justify-content:space-between}
.banner .btn{min-height:32px;padding:4px 10px;font-size:.8rem}
/* sheets */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.sheet-h{flex:none;padding-top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line-2)}
.sheet-h .bar{display:flex;align-items:center;gap:10px;padding-block:12px}
.sheet-h h2{flex:1;font-size:1.15rem;min-width:0}
.sheet-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-b .wrap{padding-block:18px 28px;display:flex;flex-direction:column;gap:16px}
.sheet-f{flex:none;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-f .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.steps{display:flex;gap:5px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--ink)}
.counter{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2)}
.counter.zero{background:var(--good-bg);color:var(--good-ink)}
.counter.left{background:var(--warn-bg);color:var(--warn-ink)}
.counter.over{background:var(--bad-bg);color:var(--bad-ink)}
.counter .amt{font-size:1.1rem}
.modal{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--surface);border-radius:20px;padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:80;background:var(--primary);color:var(--on-primary);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
body.locked .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 64px)}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--primary);color:var(--on-primary);font-size:.8rem;padding:7px 10px;border-radius:9px;max-width:240px;white-space:pre-line;font-variant-numeric:tabular-nums;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:10px;font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line-2);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.chart [data-tip]{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{padding:8px 6px;border-top:1px solid var(--line-2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal}
.tbl thead th{border-top:0;font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.list-btn{display:flex;align-items:center;gap:12px;padding:13px 0;border:0;border-top:1px solid var(--line-2);background:none;width:100%;text-align:left;font-weight:600}
.list-btn:first-child{border-top:0}
.list-btn span{flex:1}
.welcome{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.welcome .big{font-size:2.6rem}
.flow{display:flex;flex-direction:column;gap:0}
.flow-step{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:10px 0}
.flow-step .dot{width:12px;height:12px;margin-top:5px;border-radius:4px}
.flow-step b{display:block}

}

<body>
<header class="top" id="top"></header>
<main class="wrap" id="main" aria-live="polite">
  <div class="loading"><div><div class="brand" style="flex:none">Cycle Ledger</div><p class="sub">Loading your accounts…</p></div></div>
</main>
<nav class="nav" id="nav" hidden></nav>
<div id="sheet" class="sheet" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="tip" class="tip" hidden></div>
<script>
'use strict';
/* ================= utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const r2 = n => Math.round((+n || 0) * 100) / 100;
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? r2(n) : 0; };
const sum = arr => r2(arr.reduce((a, b) => a + (+b || 0), 0));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => isoOf(new Date());
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fdate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return d + ' ' + MON[m - 1] + ' ' + y; };
const fday = iso => { if (!iso) return ''; const [, m, d] = iso.split('-').map(Number); return d + ' ' + MON[m - 1]; };
function fmt(n) {
  n = r2(n);
  const a = Math.abs(n);
  const s = a.toLocaleString('en-US', { minimumFractionDigits: Number.isInteger(a) ? 0 : 2, maximumFractionDigits: 2 });
  return (n < 0 ? '−' : '') + s;
}
const money = n => `<span class="cur">AED</span>${fmt(n)}`;
const plain = n => 'AED ' + fmt(n);
function compact(n) {
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e6) return s + r2(a / 1e6).toString().replace(/\.?0+$/, '') + 'M';
  if (a >= 1e3) return s + (Math.round(a / 100) / 10).toString().replace(/\.0$/, '') + 'k';
  return s + Math.round(a);
}

/* ================= icons ================= */
const I = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>',
  wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/><path d="M16 15h2"/><path d="M6 6V5a2 2 0 0 1 2-2h8"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  close: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  check: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.5"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>',
  in: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M15 17H7V9"/></svg>',
  move: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>',
  adj: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
};

/* ================= accounts ================= */
const ACCTS = [
  { k: 'salary', name: 'Salary / Emergency Fund', short: 'Emergency fund', color: 'var(--c-salary)' },
  { k: 'expense', name: 'Expense', short: 'Expense', color: 'var(--c-expense)' },
  { k: 'savings', name: 'Savings', short: 'Savings', color: 'var(--c-savings)' },
  { k: 'charity', name: 'Charity', short: 'Charity', color: 'var(--c-charity)' },
  { k: 'fun', name: 'Fun Allowance', short: 'Fun', color: 'var(--c-fun)' },
];
const AN = Object.fromEntries(ACCTS.map(a => [a.k, a]));
const XKEYS = ['expense', 'savings', 'charity', 'fun'];
const XLABEL = { expense: 'Transfer to Expense', savings: 'Transfer to Savings', charity: 'Withdraw cash for Charity', fun: 'Load Fun Allowance' };
const DEFAULT_CATS = ['Groceries', 'Fuel & transport', 'Utilities & phone', 'Subscriptions', 'Personal care', 'Miscellaneous'];

function defaultSettings() {
  return {
    v: 1, setupDone: false, created: today(),
    accounts: {
      salary: { bank: 'FAB Salary', start: 0, low: 0 },
      expense: { bank: 'Mbank', start: 0, low: 500 },
      savings: { bank: 'FAB iSave', start: 0, low: 0 },
      charity: { bank: 'Cash – locker', start: 0, low: 0 },
      fun: { bank: 'Tabby card', start: 0, low: 300 },
    },
    emergencyTarget: 0,
    categories: DEFAULT_CATS.map(n => ({ id: newId() + n.length, name: n })),
    pots: [], goals: [], shortcuts: [],
  };
}

/* ================= state ================= */
const S = {
  mode: 'loading',        // loading | live | demo | offline
  settings: null, cycles: {},
  view: 'home', acct: null, cycleView: null, insightRange: 6, acctFilter: 'cycle', year: null,
  ver: 0,
};
let LIVE = { settings: null, cycles: {} };   // last data from the store, kept while exploring the example
let firstSnapshot = false;

/* ================= store (this device only) ================= */
const STORE_KEY = 'cycle-ledger-data-v1';
const Store = {
  col: null, failed: false, inflight: new Set(), queued: new Set(),
  init() {
    let raw = null;
    try { localStorage.setItem('cl-probe', '1'); localStorage.removeItem('cl-probe'); raw = localStorage.getItem(STORE_KEY); this.col = true; }
    catch (e) { this.col = null; return false; }
    let o = {}; try { o = raw ? JSON.parse(raw) : {}; } catch (e) { o = {}; }
    LIVE = { settings: o.settings || null, cycles: o.cycles || {} };
    S.mode = 'live'; S.settings = LIVE.settings; S.cycles = LIVE.cycles; S.ver++; firstSnapshot = true;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
    window.addEventListener('storage', e => {
      if (e.key !== STORE_KEY || S.mode !== 'live') return;
      try { const n = JSON.parse(e.newValue || '{}'); LIVE = { settings: n.settings || null, cycles: n.cycles || {} }; S.settings = LIVE.settings; S.cycles = LIVE.cycles; S.ver++; renderApp(true); } catch (err) { }
    });
    renderApp();
    return true;
  },
  persist() {
    if (S.mode !== 'live') return;
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ app: 'cycle-ledger', v: 1, saved: new Date().toISOString(), settings: LIVE.settings, cycles: LIVE.cycles })); this.failed = false; }
    catch (e) { this.failed = true; toast('Couldn’t save. Your phone may be low on storage.'); }
    setSync();
  },
};
function setSync() { const el = $('#syncdot'); if (!el) return; el.hidden = !Store.failed; el.className = 'sync' + (Store.failed ? ' off' : ''); el.title = Store.failed ? 'Not saved' : ''; }
function backupDue() {
  if (S.mode !== 'live' || !S.settings) return false;
  const last = S.settings.lastBackup || S.settings.created; if (!last) return false;
  const days = (Date.now() - new Date(last + 'T00:00:00').getTime()) / 864e5;
  return S.settings.lastBackup ? days > 30 : days > 7;
}
/* save helpers: mutate S.*, then call these */
function saveSettings() { S.ver++; if (S.mode === 'live') { LIVE.settings = S.settings; Store.persist('settings'); } }
function saveCycle(c) { S.ver++; S.cycles[c.id] = c; if (S.mode === 'live') { LIVE.cycles = S.cycles; Store.persist(c.id); } }
function deleteCycleDoc(id) { S.ver++; delete S.cycles[id]; if (S.mode === 'live') { LIVE.cycles = S.cycles; Store.persist(id); } }

/* ================= model helpers ================= */
const cyclesAsc = () => Object.values(S.cycles).sort((a, b) => a.n - b.n);
const openCycle = () => cyclesAsc().find(c => c.status === 'open') || null;
const activeCats = () => S.settings.categories.filter(c => !c.archived);
const activePots = () => S.settings.pots.filter(p => !p.closed);
const activeGoals = () => S.settings.goals.filter(g => !g.closed);
const catName = id => (S.settings.categories.find(c => c.id === id) || {}).name || 'Uncategorised';
const potName = id => (S.settings.pots.find(p => p.id === id) || {}).name || 'Pot';
const goalName = id => (S.settings.goals.find(g => g.id === id) || {}).name || 'Goal';
const bankOf = k => (S.settings.accounts[k] || {}).bank || '';

function bucketLabel(acct, b) {
  if (acct === 'expense') {
    if (b === 'spend') return 'Spending money';
    if (b === 'oneoff') return 'One-off pot';
    if (b && b.startsWith('pot:')) return potName(b.slice(4));
  }
  if (acct === 'savings') {
    if (b === 'general') return 'General savings';
    if (b && b.startsWith('goal:')) return goalName(b.slice(5));
  }
  return AN[acct] ? AN[acct].name : acct;
}
function bucketsFor(acct) {
  if (acct === 'expense') return ['spend', 'oneoff', ...activePots().map(p => 'pot:' + p.id)];
  if (acct === 'savings') return ['general', ...activeGoals().map(g => 'goal:' + g.id)];
  return ['main'];
}
const defaultBucket = acct => acct === 'expense' ? 'spend' : acct === 'savings' ? 'general' : 'main';
const adjBucket = acct => acct === 'expense' ? 'oneoff' : acct === 'savings' ? 'general' : 'main';

const budgetTotal = c => sum(Object.values(c.budget || {}));
const potPlanTotal = c => sum(Object.values(c.potPlan || {}));
const goalPlanTotal = c => sum(Object.values((c.plan || {}).goals || {}));
function plannedFor(c, key) {
  const p = c.plan || {};
  if (key === 'expense') return r2(budgetTotal(c) + potPlanTotal(c) + (+p.oneoff || 0));
  if (key === 'savings') return r2((+p.general || 0) + goalPlanTotal(c));
  return r2(+p[key] || 0);
}
const plannedTotal = c => r2(['expense', 'savings', 'charity', 'fun', 'emergency'].reduce((a, k) => a + plannedFor(c, k), 0));
const incomeOf = c => sum((c.txns || []).filter(t => t.t === 'income').map(t => t.a));
const xferOf = (c, key) => (c.txns || []).find(t => t.t === 'xfer' && t.key === key) || null;

/* every transaction expands into legs: [account, bucket, signed amount] */
function legs(t, c) {
  const a = +t.a || 0;
  switch (t.t) {
    case 'income': return [['salary', 'main', a]];
    case 'in': return [[t.acct, t.b || defaultBucket(t.acct), a]];
    case 'spend': return [[t.acct, t.b || defaultBucket(t.acct), -a]];
    case 'adj': return [[t.acct, t.b || adjBucket(t.acct), a]];
    case 'move': return [[t.fa, t.fb || defaultBucket(t.fa), -a], [t.ta, t.tb || defaultBucket(t.ta), a]];
    case 'xfer': {
      const L = [['salary', 'main', -a]];
      if (t.key === 'expense') {
        const bt = budgetTotal(c); let rest = a - bt;
        L.push(['expense', 'spend', bt]);
        for (const [pid, v] of Object.entries(c.potPlan || {})) if (+v) { L.push(['expense', 'pot:' + pid, +v]); rest -= +v; }
        L.push(['expense', 'oneoff', r2(rest)]);
      } else if (t.key === 'savings') {
        let rest = a;
        for (const [gid, v] of Object.entries((c.plan || {}).goals || {})) if (+v) { L.push(['savings', 'goal:' + gid, +v]); rest -= +v; }
        L.push(['savings', 'general', r2(rest)]);
      } else L.push([t.key, 'main', a]);
      return L;
    }
  }
  return [];
}
const effectOn = (t, c, acct) => r2(legs(t, c).filter(l => l[0] === acct).reduce((s, l) => s + l[2], 0));

/* full pass over the ledger; memoised on S.ver */
let _calc = null, _calcVer = -1;
function calc() {
  if (_calcVer === S.ver && _calc) return _calc;
  const bal = {}; ACCTS.forEach(a => bal[a.k] = {});
  const add = (acct, b, v) => { if (!bal[acct]) bal[acct] = {}; bal[acct][b] = r2((bal[acct][b] || 0) + v); };
  const st = S.settings.accounts;
  add('salary', 'main', +st.salary.start || 0);
  add('expense', 'oneoff', +st.expense.start || 0);
  add('savings', 'general', +st.savings.start || 0);
  add('charity', 'main', +st.charity.start || 0);
  add('fun', 'main', +st.fun.start || 0);
  const totals = () => Object.fromEntries(ACCTS.map(a => [a.k, sum(Object.values(bal[a.k]))]));
  const snaps = [];
  for (const c of cyclesAsc()) {
    const start = totals();
    const s = { c, start, income: 0, spent: { salary: 0, expense: 0, savings: 0, charity: 0, fun: 0 }, cat: {}, potSpent: 0, oneoffSpent: 0, in: 0 };
    for (const t of (c.txns || [])) {
      for (const l of legs(t, c)) add(l[0], l[1], l[2]);
      if (t.t === 'income') s.income = r2(s.income + t.a);
      if (t.t === 'in') s.in = r2(s.in + t.a);
      if (t.t === 'spend') {
        s.spent[t.acct] = r2((s.spent[t.acct] || 0) + t.a);
        if (t.acct === 'expense') {
          if ((t.b || 'spend') === 'spend') s.cat[t.cat || '_'] = r2((s.cat[t.cat || '_'] || 0) + t.a);
          else if (t.b === 'oneoff') s.oneoffSpent = r2(s.oneoffSpent + t.a);
          else s.potSpent = r2(s.potSpent + t.a);
        }
      }
    }
    s.end = totals();
    s.endSpend = (bal.expense.spend || 0);
    snaps.push(s);
  }
  _calc = { bal, snaps, totals: totals() };
  _calcVer = S.ver;
  return _calc;
}
const acctTotal = k => calc().totals[k] || 0;
const COUNTED = ACCTS.filter(a => a.k !== 'charity');   // charity cash is set aside, not counted as Ethan's money
const grandTotal = () => sum(COUNTED.map(a => acctTotal(a.k)));
const endTotal = s => sum(COUNTED.map(a => s.end[a.k] || 0));
const bucketBal = (k, b) => calc().bal[k][b] || 0;
const snapOf = c => calc().snaps.find(s => s.c.id === c.id);

function lowAlerts() {
  const out = []; const c = openCycle();
  for (const a of ACCTS) {
    const low = +S.settings.accounts[a.k].low || 0; if (!low) continue;
    let v;
    if (a.k === 'expense') { if (!c || !c.planned || !xferOf(c, 'expense')) continue; v = bucketBal('expense', 'spend'); }
    else v = acctTotal(a.k);
    if (v < low) out.push({ k: a.k, v, low });
  }
  return out;
}

function txTitle(t) {
  switch (t.t) {
    case 'income': return t.note || 'Commission';
    case 'in': return t.note || ('Money in · ' + bucketLabel(t.acct, t.b));
    case 'spend':
      if (t.acct === 'expense') return (t.b || 'spend') === 'spend' ? catName(t.cat) : bucketLabel('expense', t.b);
      return t.note || ({ fun: 'Fun spending', charity: 'Donation', salary: 'Emergency use', savings: 'Withdrawal' }[t.acct]);
    case 'xfer': return XLABEL[t.key];
    case 'move': return t.sys ? (t.note || 'Carried forward') : 'Moved: ' + bucketLabel(t.fa, t.fb) + ' → ' + bucketLabel(t.ta, t.tb);
    case 'adj': return 'Balance check adjustment';
  }
  return 'Entry';
}
function txSub(t) {
  const bits = [fday(t.d)];
  if (t.t === 'spend' || t.t === 'in') bits.push(AN[t.acct].name + (t.acct === 'expense' || t.acct === 'savings' ? ' · ' + bucketLabel(t.acct, t.b || defaultBucket(t.acct)) : ''));
  if (t.t === 'xfer') bits.push(bankOf(t.key));
  if (t.t === 'adj') bits.push(AN[t.acct].name);
  if (t.note && t.t === 'spend' && t.acct === 'expense') bits.push(t.note);
  if (t.note && t.t === 'move' && !t.sys) bits.push(t.note);
  return bits.filter(Boolean).join(' · ');
}
function txIcon(t) { return t.t === 'income' || t.t === 'in' ? I.in : t.t === 'spend' ? I.out : t.t === 'adj' ? I.adj : I.move; }
function allTxns() {
  const out = [];
  for (const c of cyclesAsc()) for (const t of (c.txns || [])) out.push({ t, c });
  return out.sort((x, y) => (y.t.d || '').localeCompare(x.t.d || '') || (y.t.ts || 0) - (x.t.ts || 0));
}
function findTx(id) { for (const c of Object.values(S.cycles)) { const t = (c.txns || []).find(x => x.id === id); if (t) return { t, c }; } return null; }

function newCycle(n, start) { return { id: 'c' + newId(), n, status: 'open', planned: false, start: start || today(), end: null, budget: {}, potPlan: {}, plan: {}, txns: [] }; }
function addTx(c, t) { t.id = t.id || newId(); t.ts = Date.now(); c.txns = c.txns || []; c.txns.push(t); saveCycle(c); return t; }
function lastPlannedCycle(exceptId) { return cyclesAsc().filter(c => c.planned && c.id !== exceptId).pop() || null; }

/* ================= shell rendering ================= */
function renderApp(fromSnapshot) {
  renderTop(); renderNav(); renderMain();
  if (!fromSnapshot && SHEET) renderSheet();
  if (fromSnapshot && SHEET && SHEET.liveRefresh) renderSheet(true);
}
function renderTop() {
  const top = $('#top');
  const c = S.settings && S.settings.setupDone ? openCycle() : null;
  let left = '';
  if ((S.view === 'acct' || S.view === 'cycle' || S.view === 'history') && S.settings && S.settings.setupDone) left = `<button class="back" data-act="back" aria-label="Back">${I.back}</button>`;
  const titles = { home: 'Cycle Ledger', accounts: 'Accounts', insights: 'Insights', more: 'Settings', acct: S.acct ? AN[S.acct].name : '', history: 'Cycle history', cycle: S.cycleView && S.cycles[S.cycleView] ? 'Cycle ' + S.cycles[S.cycleView].n : 'Cycle' };
  const title = S.settings && S.settings.setupDone ? titles[S.view] : 'Cycle Ledger';
  top.innerHTML = `<div class="wrap">${left}<div class="brand">${esc(title)}</div>${c ? `<span class="chip-cycle">Cycle ${c.n}${c.planned ? '' : ' · not started'}</span>` : ''}<span id="syncdot" class="sync" ${S.mode === 'live' ? '' : 'hidden'}></span></div>`;
  setSync();
}
function renderNav() {
  const nav = $('#nav');
  if (!S.settings || !S.settings.setupDone || (S.mode !== 'live' && S.mode !== 'demo')) { nav.hidden = true; return; }
  nav.hidden = false;
  const cur = { home: 'home', accounts: 'accounts', acct: 'accounts', insights: 'insights', history: 'insights', cycle: 'insights', more: 'more' }[S.view];
  const b = (v, ic, label) => `<button data-act="nav" data-v="${v}" ${cur === v ? 'aria-current="page"' : ''}>${ic}<span>${label}</span></button>`;
  nav.innerHTML = `<div class="wrap">${b('home', I.home, 'Home')}${b('accounts', I.wallet, 'Accounts')}<button class="add" data-act="quickadd" aria-label="Add a transaction">${I.plus}</button>${b('insights', I.chart, 'Insights')}${b('more', I.more, 'Settings')}</div>`;
}
function renderMain() {
  const m = $('#main');
  if (S.mode === 'loading') return;
  if (S.mode === 'offline') { m.innerHTML = viewOffline(); return; }
  if (!S.settings || !S.settings.setupDone) { m.innerHTML = S.view === 'setup' ? viewSetup() : viewWelcome(); return; }
  const demo = S.mode === 'demo' ? `<div class="banner"><span>Example data. Nothing here is saved.</span><button class="btn sm" data-act="exitDemo">Exit example</button></div>` : '';
  const v = { home: viewHome, accounts: viewAccounts, acct: viewAcct, insights: viewInsights, more: viewMore, history: viewHistory, cycle: viewCycle }[S.view] || viewHome;
  m.innerHTML = demo + v();
}

/* ================= first run ================= */

}

      <div class="grid2">

        <div class="field"><label for="su-low-fun">Warn me when Fun Allowance drops below</label><input class="inp money" id="su-low-fun" inputmode="decimal" data-setup="accounts.fun.low" value="${s.accounts.fun.low || ''}"></div>

/* ================= home ================= */
function acctLine(k) {
  const c = openCycle();
  if (k === 'salary') { const t = +S.settings.emergencyTarget || 0; return t ? Math.min(999, Math.round(acctTotal('salary') / t * 100)) + '% of target' : 'No target set'; }
  if (k === 'expense') return plain(bucketBal('expense', 'spend')) + ' to spend';
  if (k === 'savings') { const g = activeGoals().length; return g ? g + (g === 1 ? ' goal' : ' goals') : 'General savings'; }
  if (k === 'charity') { const s = c ? snapOf(c) : null; return s && s.spent.charity ? plain(s.spent.charity) + ' given' : 'Cash on hand'; }
  if (k === 'fun') return 'Left this cycle';
  return '';
}
function viewHome() {
  const total = grandTotal();
  const pos = COUNTED.map(a => Math.max(0, acctTotal(a.k)));
  const posSum = pos.reduce((a, b) => a + b, 0) || 1;
  const bar = COUNTED.map((a, i) => pos[i] > 0 ? `<span style="flex:${pos[i] / posSum};background:${a.color}" data-tip="${esc(a.name)}\n${plain(acctTotal(a.k))}"></span>` : '').join('');
  const row = (a, line, cls = '') => `<button class="acct-row ${cls}" data-act="openAcct" data-k="${a.k}"><span class="dot" style="background:${a.color}"></span><span style="min-width:0"><span class="nm">${a.name}</span><div class="bk">${esc(bankOf(a.k))}</div></span><span class="v">${money(acctTotal(a.k))}<small>${esc(line)}</small></span>${I.chev}</button>`;
  const rows = COUNTED.map(a => row(a, acctLine(a.k))).join('') + row(AN.charity, 'Set aside · not in total', 'aside');
  const alerts = lowAlerts().map(x => `<button class="alert" data-act="openAcct" data-k="${x.k}">${I.warn}<span>${x.k === 'expense' ? 'Expense spending money' : AN[x.k].name} is low: ${plain(x.v)} left (limit ${plain(x.low)})</span></button>`).join('');
  const c = openCycle();
  const bk = backupDue() ? `<button class="alert info" data-act="backup">${I.warn}<span>${S.settings.lastBackup ? 'Your last backup was ' + fdate(S.settings.lastBackup) + '.' : 'You haven’t backed up yet.'} Tap to save a backup.</span></button>` : '';
  return `
  <section class="card">
    <div class="eyebrow">Total money</div>
    <div class="big">${money(total)}</div>
    <div class="stack" role="img" aria-label="Split of your money by account">${bar}</div>
    <div class="acct-list">${rows}</div>
  </section>
  ${alerts || bk ? `<div class="alerts">${alerts}${bk}</div>` : ''}
  ${c ? cycleCard(c) : ''}
  ${setAsideCard()}
  ${recentCard(c)}`;
}
function setAsideCard() {
  const pots = activePots();
  const potSum = sum(pots.map(p => bucketBal('expense', 'pot:' + p.id)));
  return `<section class="card">
    <div class="card-h"><h2>Spending money & pots</h2><button class="link" data-act="openAcct" data-k="expense">Details</button></div>
    <div class="stats">
      <div class="stat"><div class="eyebrow">Spending money</div><div class="v">${money(bucketBal('expense', 'spend'))}</div></div>
      <div class="stat"><div class="eyebrow">One-off pot</div><div class="v">${money(bucketBal('expense', 'oneoff'))}</div></div>
      <div class="stat"><div class="eyebrow">Annual pots</div><div class="v">${money(potSum)}</div></div>
      <div class="stat"><div class="eyebrow">Fun left</div><div class="v">${money(acctTotal('fun'))}</div></div>
    </div>
  </section>`;
}
function cycleCard(c) {
  const s = snapOf(c);
  if (!c.planned) {
    const inc = incomeOf(c);
    return `<section class="card">
      <div class="card-h"><h2>Cycle ${c.n}</h2><span class="pill">Since ${fday(c.start)}</span></div>
      <p class="ink2">Not started yet. Log your commission, set this month’s expenses and split the money across your accounts.</p>
      ${inc ? `<div class="kv" style="margin-top:8px"><span>Income logged</span><b>${plain(inc)}</b></div>` : ''}
      <div class="sp"></div>
      <button class="btn primary block" data-act="plan">Start cycle ${c.n}</button>
    </section>`;
  }
  const spent = r2(s.spent.expense + s.spent.fun);
  const left = r2(bucketBal('expense', 'spend') + acctTotal('fun'));
  const doneCount = XKEYS.filter(k => plannedFor(c, k) > 0 && xferOf(c, k)).length;
  const needCount = XKEYS.filter(k => plannedFor(c, k) > 0 || xferOf(c, k)).length;
  return `<section class="card">
    <div class="card-h"><h2>Cycle ${c.n}</h2><span class="pill ${doneCount === needCount ? 'good' : 'warn'}">${doneCount}/${needCount} transfers done</span></div>
    <div class="stats">
      <div class="stat"><div class="eyebrow">Earned</div><div class="v">${money(s.income)}</div></div>
      <div class="stat"><div class="eyebrow">Allocated</div><div class="v">${money(plannedTotal(c))}</div></div>
      <div class="stat"><div class="eyebrow">Spent</div><div class="v">${money(spent)}</div></div>
      <div class="stat"><div class="eyebrow">Left to spend</div><div class="v">${money(left)}</div></div>
    </div>
    <div style="margin-top:14px"><div class="eyebrow" style="margin-bottom:6px">Transfer checklist</div>${checklist(c)}</div>
    <div class="btn-row" style="margin-top:14px"><button class="btn" data-act="plan">Edit plan</button><button class="btn primary" data-act="closeCycle">Close cycle</button></div>
  </section>`;
}
function checklist(c) {
  const rows = XKEYS.map(k => {
    const p = plannedFor(c, k), t = xferOf(c, k);
    if (!p && !t) return '';
    const done = !!t;
    const diff = done ? r2(t.a - p) : 0;
    return `<button class="check ${done ? 'done' : ''}" data-act="xfer" data-k="${k}">
      <span class="box">${done ? I.check : ''}</span>
      <span style="min-width:0"><div class="t">${XLABEL[k]}</div><div class="s">${esc(bankOf(k))}${done ? ' · done ' + fday(t.d) : ''}</div>${done && diff ? `<span class="diff">${plain(Math.abs(diff))} ${diff > 0 ? 'more' : 'less'} than planned</span>` : ''}</span>
      <span class="a">${money(done ? t.a : p)}</span></button>`;
  }).join('');
  const em = plannedFor(c, 'emergency');
  const emRow = em ? `<div class="check static"><span class="box"></span><span><div class="t">Emergency fund</div><div class="s">Stays in ${esc(bankOf('salary'))}. Nothing to transfer.</div></span><span class="a">${money(em)}</span></div>` : '';
  return `<div class="check-list">${rows}${emRow}</div>`;
}
function recentCard(c) {
  const list = allTxns().filter(x => !x.t.sys).slice(0, 6);
  return `<section class="card"><div class="card-h"><h2>Recent</h2>${list.length ? '<button class="link" data-act="nav" data-v="accounts">All accounts</button>' : ''}</div>
    ${list.length ? `<div class="tx-list">${list.map(x => txRow(x.t, x.c)).join('')}</div>` : `<div class="empty">Nothing logged yet. Tap + to add spending or income.</div>`}</section>`;
}
function txRow(t, c, acct) {
  let amt, cls = '';
  if (acct) { amt = effectOn(t, c, acct); cls = amt > 0 ? 'pos' : ''; }
  else if (t.t === 'income' || t.t === 'in') { amt = t.a; cls = 'pos'; }
  else if (t.t === 'spend') amt = -t.a;
  else if (t.t === 'adj') { amt = t.a; cls = amt > 0 ? 'pos' : ''; }
  else { amt = t.a; cls = 'neu'; }
  const sign = cls === 'neu' ? '' : amt > 0 ? '+' : '';
  return `<button class="tx" data-act="editTx" data-id="${t.id}"><span class="ic">${txIcon(t)}</span><span style="min-width:0"><div class="t">${esc(txTitle(t))}</div><div class="s">${esc(txSub(t))}</div></span><span class="a ${cls}">${sign}${fmt(amt)}</span></button>`;
}

/* ================= accounts ================= */
function viewAccounts() {
  return ACCTS.map(a => {
    const extra = acctExtra(a.k);
    return `<section class="card" style="padding:0"><button class="acct-row" style="padding:16px;border:0" data-act="openAcct" data-k="${a.k}"><span class="dot" style="background:${a.color}"></span><span style="min-width:0"><span class="nm">${a.name}</span><div class="bk">${esc(bankOf(a.k))}</div></span><span class="v">${money(acctTotal(a.k))}<small>${esc(acctLine(a.k))}</small></span>${I.chev}</button>${extra ? `<div style="padding:0 16px 16px">${extra}</div>` : ''}</section>`;
  }).join('');
}
function acctExtra(k) {
  if (k === 'salary') { const t = +S.settings.emergencyTarget || 0; if (!t) return ''; const p = Math.max(0, Math.min(100, acctTotal('salary') / t * 100)); return `<div class="prog"><span style="width:${p}%;background:var(--c-salary)"></span></div>`; }
  return '';
}
function viewAcct() {
  const k = S.acct, a = AN[k], c = openCycle();
  const head = `<section class="card"><div class="acct-head"><span class="sw" style="background:${a.color}"></span><div style="min-width:0;flex:1"><div class="eyebrow">${esc(bankOf(k)) || 'No bank set'}</div><div class="big" style="font-size:2rem">${money(acctTotal(k))}</div></div></div>
    <div class="btn-row" style="margin-top:14px">${k === 'salary' ? '' : `<button class="btn sm" data-act="quickadd" data-k="${k}" data-mode="spend">${k === 'charity' ? 'Log donation' : k === 'savings' ? 'Withdraw' : 'Add spending'}</button>`}${k === 'salary' ? `<button class="btn sm" data-act="quickadd" data-k="salary" data-mode="income">Log commission</button><button class="btn sm" data-act="quickadd" data-k="salary" data-mode="spend">Use emergency fund</button>` : `<button class="btn sm" data-act="quickadd" data-k="${k}" data-mode="in">Money in</button>`}<button class="btn sm" data-act="quickadd" data-k="${k}" data-mode="move">Move money</button><button class="btn sm" data-act="checkBal" data-k="${k}">Check balance</button></div>
    <button class="edit-inline" style="margin-top:12px" data-act="editBank" data-k="${k}">Change bank or card</button></section>`;
  return head + acctPanel(k, c) + acctTxns(k);
}
function acctPanel(k, c) {
  const s = c ? snapOf(c) : null;
  if (k === 'salary') {
    const t = +S.settings.emergencyTarget || 0, bal = acctTotal('salary');
    const pending = c && c.planned ? sum(XKEYS.filter(x => !xferOf(c, x)).map(x => plannedFor(c, x))) : 0;
    return `<section class="card"><div class="card-h"><h2>Emergency fund</h2><button class="link" data-act="editTarget">${t ? 'Change target' : 'Set target'}</button></div>
      ${t ? `<div class="kv"><span>Target</span><b>${plain(t)}</b></div><div class="kv"><span>${bal >= t ? 'Target reached' : 'Still to go'}</span><b>${bal >= t ? plain(bal - t) + ' over' : plain(t - bal)}</b></div><div class="prog"><span style="width:${Math.max(0, Math.min(100, bal / t * 100))}%;background:var(--c-salary)"></span></div>
      ${bal >= t ? `<p class="callout" style="margin-top:12px">You’ve hit your target. When you plan the next cycle, you can send what would have gone here to Savings instead.</p>` : ''}` : `<p class="hint">Set a target to track progress. 3–6 months of expenses is a common target.</p>`}
      ${pending ? `<p class="callout" style="margin-top:12px">${plain(pending)} of this balance is still waiting to be transferred out this cycle.</p>` : ''}</section>`;
  }
  if (k === 'expense') {
    const cats = c && c.planned ? Object.keys(c.budget || {}).filter(id => +c.budget[id] || (s && s.cat[id])) : [];
    const extraCats = s ? Object.keys(s.cat).filter(id => !cats.includes(id)) : [];
    const rows = [...cats, ...extraCats].map(id => catBar(catName(id), s ? (s.cat[id] || 0) : 0, +(c.budget || {})[id] || 0)).join('');
    const pots = activePots().map(p => { const b = bucketBal('expense', 'pot:' + p.id); return `<div class="bar-row"><span class="n">${esc(p.name)}</span><span class="v">${fmt(b)}${p.target ? ' / ' + fmt(p.target) : ''}</span>${p.target ? `<div class="track"><div class="fill" style="width:${Math.max(0, Math.min(100, b / p.target * 100))}%;background:var(--c-expense)"></div></div>` : ''}</div>`; }).join('');
    return `<section class="card"><div class="card-h"><h2>This month’s expenses</h2><span class="sub">${money(bucketBal('expense', 'spend'))} left</span></div>
        ${rows ? `<div>${rows}</div>` : `<div class="empty">Set this month’s expected expenses when you start a cycle.</div>`}</section>
      <section class="card"><div class="card-h"><h2>Annual pots</h2><button class="link" data-act="newPot">Start a pot</button></div>
        ${pots || `<div class="empty">No pots yet. Start one when a yearly or quarterly bill comes up, like rent, car insurance or the gym.</div>`}</section>
      <section class="card"><div class="card-h"><h2>One-off pot</h2><span class="mid">${money(bucketBal('expense', 'oneoff'))}</span></div><p class="hint">For unexpected costs and one-time payments. Unspent expense money moves here when you close a cycle.</p></section>`;
  }
  if (k === 'savings') {
    const goals = activeGoals().map(g => { const b = bucketBal('savings', 'goal:' + g.id); return `<div class="bar-row"><span class="n">${esc(g.name)}</span><span class="v">${fmt(b)}${g.target ? ' / ' + fmt(g.target) : ''}</span>${g.target ? `<div class="track"><div class="fill" style="width:${Math.max(0, Math.min(100, b / g.target * 100))}%;background:var(--c-savings)"></div></div>` : ''}</div>`; }).join('');
    return `<section class="card"><div class="card-h"><h2>Where your savings sit</h2><button class="link" data-act="newGoal">Add a goal</button></div>
      <div class="bar-row"><span class="n">General savings</span><span class="v">${fmt(bucketBal('savings', 'general'))}</span></div>${goals}
      ${!goals ? '<p class="hint" style="margin-top:6px">Goals are optional. Without them, everything counts as general savings.</p>' : ''}</section>`;
  }
  if (k === 'charity') {
    const yr = today().slice(0, 4);
    const yearGiven = sum(allTxns().filter(x => x.t.t === 'spend' && x.t.acct === 'charity' && (x.t.d || '').startsWith(yr)).map(x => x.t.a));
    return `<section class="card"><div class="kv"><span>Cash that should be in the locker</span><b>${plain(acctTotal('charity'))}</b></div><div class="kv"><span>Given this cycle</span><b>${plain(s ? s.spent.charity : 0)}</b></div><div class="kv"><span>Given in ${yr}</span><b>${plain(yearGiven)}</b></div></section>`;
  }
  if (k === 'fun') {
    const t = c ? xferOf(c, 'fun') : null;
    const allowance = t ? t.a : c ? plannedFor(c, 'fun') : 0;
    return `<section class="card"><div class="kv"><span>This cycle’s allowance${t ? '' : ' (not loaded yet)'}</span><b>${plain(allowance)}</b></div><div class="kv"><span>Carried over from last cycle</span><b>${plain(s ? s.start.fun : 0)}</b></div><div class="kv"><span>Spent this cycle</span><b>${plain(s ? s.spent.fun : 0)}</b></div><div class="kv"><span>Left</span><b>${plain(acctTotal('fun'))}</b></div></section>`;
  }
  return '';
}
function catBar(name, spent, expected) {
  const max = Math.max(spent, expected) || 1;
  const over = expected && spent > expected;
  return `<div class="bar-row"><span class="n">${esc(name)}</span><span class="v">${fmt(spent)} / ${fmt(expected)}</span><div class="track"><div class="fill" style="width:${spent / max * 100}%;background:var(--c-expense)"></div>${expected ? `<div class="mark" style="left:calc(${expected / max * 100}% - 1px)"></div>` : ''}</div>${over ? `<span class="note">${plain(spent - expected)} over</span>` : ''}</div>`;
}
function acctTxns(k) {
  const c = openCycle();
  const list = allTxns().filter(x => (S.acctFilter === 'all' || (c && x.c.id === c.id)) && legs(x.t, x.c).some(l => l[0] === k) && effectOn(x.t, x.c, k) !== 0);
  return `<section class="card"><div class="card-h"><h2>Transactions</h2><div class="tabs" style="width:164px;flex:none"><button data-act="acctFilter" data-v="cycle" aria-pressed="${S.acctFilter === 'cycle'}">This cycle</button><button data-act="acctFilter" data-v="all" aria-pressed="${S.acctFilter === 'all'}">All</button></div></div>
    ${list.length ? `<div class="tx-list">${list.slice(0, 200).map(x => txRow(x.t, x.c, k)).join('')}</div>` : '<div class="empty">No transactions yet.</div>'}</section>`;
}

/* ================= history ================= */
function viewHistory() {
  const list = calc().snaps.slice().reverse();
  return `<section class="card">${list.map(s => { const c = s.c; return `<button class="list-btn" data-act="openCycle" data-id="${c.id}"><span><b>Cycle ${c.n}</b><div class="sub">${fdate(c.start)}${c.end ? ' – ' + fdate(c.end) : ' · open'}</div></span><span class="num" style="text-align:right"><div>${plain(s.income)}</div><div class="sub">earned</div></span>${I.chev}</button>`; }).join('') || '<div class="empty">No cycles yet.</div>'}</section>`;
}
function viewCycle() {
  const c = S.cycles[S.cycleView]; if (!c) return '<div class="empty">Cycle not found.</div>';
  return cycleSummary(c) + `<section class="card"><div class="card-h"><h2>Transactions</h2></div>${(c.txns || []).length ? `<div class="tx-list">${c.txns.slice().sort((a, b) => (b.d || '').localeCompare(a.d || '') || (b.ts || 0) - (a.ts || 0)).map(t => txRow(t, c)).join('')}</div>` : '<div class="empty">No transactions.</div>'}</section>`;
}
function cycleSummary(c) {
  const s = snapOf(c);
  const xrows = XKEYS.map(k => { const p = plannedFor(c, k), t = xferOf(c, k); if (!p && !t) return ''; return `<tr><td>${AN[k].name}</td><td>${fmt(p)}</td><td>${t ? fmt(t.a) : '<span class="muted">not done</span>'}</td></tr>`; }).join('');
  const cats = Object.keys({ ...(c.budget || {}), ...s.cat }).filter(id => +((c.budget || {})[id]) || s.cat[id]);

/* ================= charts ================= */
function niceScale(lo, hi, n = 4) {
  if (hi === lo) hi = lo + 1;
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, ticks = [];
  for (let v = a; v <= b + step / 2; v += step) ticks.push(r2(v));
  return { lo: a, hi: b, ticks };
}
function barPath(x, y0, y1, w, r) {
  const h = Math.abs(y0 - y1); if (h < 0.5) return '';
  r = Math.min(r, h, w / 2);
  if (y1 < y0) return `M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 + r}V${y0}Z`;
  return `M${x},${y0}V${y1 - r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 - r}V${y0}Z`;
}
function axisFrame(W, H, padL, padT, padB, sc, y) {
  return sc.ticks.map(t => `<line class="${t === 0 ? 'base' : 'grid'}" x1="${padL}" x2="${W - 4}" y1="${y(t)}" y2="${y(t)}"/><text x="${padL - 6}" y="${y(t) + 3.5}" text-anchor="end">${compact(t)}</text>`).join('');
}
function xLabels(labels, xc, H, padB) {
  const every = Math.ceil(labels.length / 8);
  return labels.map((l, i) => (i % every === 0 || i === labels.length - 1) ? `<text x="${xc(i)}" y="${H - padB + 15}" text-anchor="middle">${esc(l)}</text>` : '').join('');
}
/* series: [{name, color, values}] ; stacked bars, or a single series that may go negative */
function barChart({ labels, series, tips, stacked = false, H = 170 }) {
  const W = 340, padL = 36, padT = 8, padB = 22, n = labels.length;
  const totals = labels.map((_, i) => stacked ? series.reduce((s, se) => s + Math.max(0, se.values[i] || 0), 0) : (series[0].values[i] || 0));
  const sc = niceScale(Math.min(0, ...totals), Math.max(0, ...totals));
  const y = v => padT + (sc.hi - v) / (sc.hi - sc.lo) * (H - padT - padB);
  const slot = (W - padL - 6) / n, bw = Math.min(26, slot * 0.62), xc = i => padL + slot * i + slot / 2;
  let marks = '';
  labels.forEach((_, i) => {
    const x = xc(i) - bw / 2;
    if (stacked) {
      let base = 0; const segs = series.map(se => ({ v: Math.max(0, se.values[i] || 0), c: se.color })).filter(s => s.v > 0);
      segs.forEach((s, j) => {
        const top = j === segs.length - 1;
        const y0 = y(base), y1 = y(base + s.v);
        if (top) marks += `<path d="${barPath(x, y0, y1, bw, 4)}" style="fill:${s.c}"/>`;
        else { const h = Math.max(0, y0 - y1 - 2); if (h > 0) marks += `<rect x="${x}" y="${y1 + 2}" width="${bw}" height="${h}" style="fill:${s.c}"/>`; }
        base += s.v;
      });
    } else {
      const v = series[0].values[i] || 0;
      marks += `<path d="${barPath(x, y(0), y(v), bw, 4)}" style="fill:${series[0].color}"/>`;
    }
    marks += `<rect x="${padL + slot * i}" y="${padT}" width="${slot}" height="${H - padT - padB}" fill="transparent" data-tip="${esc(tips[i])}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${axisFrame(W, H, padL, padT, padB, sc, y)}${marks}${xLabels(labels, xc, H, padB)}</svg>`;
}
function lineChart({ labels, values, color, tips, ref, refLabel, H = 160 }) {
  const W = 340, padL = 36, padT = 12, padB = 22, n = labels.length;
  const all = values.concat(ref ? [ref] : []);
  const sc = niceScale(Math.min(0, ...all), Math.max(...all));
  const y = v => padT + (sc.hi - v) / (sc.hi - sc.lo) * (H - padT - padB);
  const slot = (W - padL - 6) / n, xc = i => padL + slot * i + slot / 2;
  const pts = values.map((v, i) => [xc(i), y(v)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
  const area = n > 1 ? `<path d="${d}L${pts[n - 1][0]},${y(Math.max(0, sc.lo))}L${pts[0][0]},${y(Math.max(0, sc.lo))}Z" style="fill:${color};opacity:.12"/>` : '';
  const last = pts[n - 1];
  const refLine = ref ? `<line x1="${padL}" x2="${W - 4}" y1="${y(ref)}" y2="${y(ref)}" style="stroke:var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W - 6}" y="${y(ref) - 5}" text-anchor="end" style="fill:var(--ink-2)">${esc(refLabel || '')}</text>` : '';
  const hits = labels.map((_, i) => `<rect x="${padL + slot * i}" y="${padT}" width="${slot}" height="${H - padT - padB}" fill="transparent" data-tip="${esc(tips[i])}"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${axisFrame(W, H, padL, padT, padB, sc, y)}${refLine}${area}<path d="${d}" fill="none" style="stroke:${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p, i) => i === n - 1 ? '' : `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" style="fill:${color}"/>`).join('')}${last ? `<circle cx="${last[0]}" cy="${last[1]}" r="5" style="fill:${color};stroke:var(--surface)" stroke-width="2"/>` : ''}${hits}${xLabels(labels, xc, H, padB)}</svg>`;
}
const legendHtml = items => `<div class="legend">${items.map(it => `<span><span class="dot" style="background:${it.color};width:10px;height:10px;border-radius:3px"></span>${esc(it.name)}</span>`).join('')}</div>`;

/* ================= insights ================= */
function viewInsights() {
  const all = calc().snaps;
  if (!all.length) return '<div class="empty">Insights appear once you have a cycle.</div>';
  const shown = S.insightRange === 'all' ? all : all.slice(-S.insightRange);
  const labels = shown.map(s => 'C' + s.c.n);
  const span = s => `Cycle ${s.c.n} (${fday(s.c.start)}${s.c.end ? '–' + fday(s.c.end) : ', open'})`;
  const income = barChart({ labels, series: [{ name: 'Earned', color: 'var(--c-salary)', values: shown.map(s => s.income) }], tips: shown.map(s => `${span(s)}\nEarned ${plain(s.income)}`) });
  const spend = barChart({ labels, stacked: true, series: [
    { name: 'Expense', color: 'var(--c-expense)', values: shown.map(s => s.spent.expense) },
    { name: 'Fun', color: 'var(--c-fun)', values: shown.map(s => s.spent.fun) },
    { name: 'Charity', color: 'var(--c-charity)', values: shown.map(s => s.spent.charity) }],
    tips: shown.map(s => `${span(s)}\nExpense ${plain(s.spent.expense)}\nFun ${plain(s.spent.fun)}\nCharity ${plain(s.spent.charity)}`) });
  const totals = shown.map(endTotal);
  const totalLine = lineChart({ labels, values: totals, color: 'var(--ink)', tips: shown.map((s, i) => `${span(s)}\nTotal ${plain(totals[i])}`) });
  const saved = shown.map(s => r2(s.end.savings - s.start.savings));
  const savedBars = barChart({ labels, series: [{ name: 'Saved', color: 'var(--c-savings)', values: saved }], tips: shown.map((s, i) => `${span(s)}\nAdded to savings ${plain(saved[i])}\nSavings balance ${plain(s.end.savings)}`) });
  const tgt = +S.settings.emergencyTarget || 0;
  const emLine = lineChart({ labels, values: shown.map(s => s.end.salary), color: 'var(--c-salary)', ref: tgt || null, refLabel: 'Target', tips: shown.map(s => `${span(s)}\nEmergency fund ${plain(s.end.salary)}`) });
  const funBars = barChart({ labels, series: [{ name: 'Fun', color: 'var(--c-fun)', values: shown.map(s => s.spent.fun) }], tips: shown.map(s => `${span(s)}\nFun spending ${plain(s.spent.fun)}`) });
  const cur = openCycle() || all[all.length - 1].c; const cs = snapOf(cur);
  const catIds = Object.keys({ ...(cur.budget || {}), ...cs.cat }).filter(id => +((cur.budget || {})[id]) || cs.cat[id]);
  const rangeBtn = (v, l) => `<button data-act="range" data-v="${v}" aria-pressed="${S.insightRange === v}">${l}</button>`;
  return `
  <div class="tabs">${rangeBtn(6, 'Last 6')}${rangeBtn(12, 'Last 12')}${rangeBtn('all', 'All cycles')}</div>
  <section class="card"><div class="card-h"><h2>Earned per cycle</h2></div>${income}</section>
  <section class="card"><div class="card-h"><h2>Spending per cycle</h2></div>${legendHtml([{ name: 'Expense', color: 'var(--c-expense)' }, { name: 'Fun', color: 'var(--c-fun)' }, { name: 'Charity', color: 'var(--c-charity)' }])}${spend}</section>
  <section class="card"><div class="card-h"><h2>Cycle ${cur.n} expenses by category</h2></div>${catIds.length ? catIds.map(id => catBar(catName(id), cs.cat[id] || 0, +((cur.budget || {})[id]) || 0)).join('') : '<div class="empty">No expenses planned or logged yet.</div>'}<p class="hint" style="margin-top:8px">Bar = spent. Line = expected.</p></section>
  <section class="card"><div class="card-h"><h2>Total money</h2><span class="sub">end of each cycle, excluding charity</span></div>${totalLine}</section>
  <section class="card"><div class="card-h"><h2>Emergency fund</h2></div>${emLine}</section>
  <section class="card"><div class="card-h"><h2>Added to savings</h2></div>${savedBars}</section>
  <section class="card"><div class="card-h"><h2>Fun spending</h2></div>${funBars}</section>
  ${yearSummary()}
  <section class="card"><button class="list-btn" data-act="nav" data-v="history"><span>Cycle history</span>${I.chev}</button></section>`;
}
function yearSummary() {
  const tx = allTxns();
  const years = [...new Set(tx.map(x => (x.t.d || '').slice(0, 4)).filter(Boolean))].sort().reverse();
  if (!years.length) return '';
  const yr = S.year && years.includes(S.year) ? S.year : years[0];
  const inYr = tx.filter(x => (x.t.d || '').startsWith(yr));
  const tot = (f) => sum(inYr.filter(x => f(x.t)).map(x => x.t.a));
  const legSum = acct => r2(inYr.reduce((s, x) => s + effectOn(x.t, x.c, acct), 0));
  const cats = {};
  inYr.filter(x => x.t.t === 'spend' && x.t.acct === 'expense').forEach(x => {
    const key = (x.t.b || 'spend') === 'spend' ? catName(x.t.cat) : bucketLabel('expense', x.t.b);
    cats[key] = r2((cats[key] || 0) + x.t.a);
  });
  const catRows = Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${fmt(v)}</td></tr>`).join('');
  const rows = [
    ['Earned', tot(t => t.t === 'income')],
    ['Other money in', tot(t => t.t === 'in')],
    ['Spent from Expense', tot(t => t.t === 'spend' && t.acct === 'expense')],
    ['Fun spending', tot(t => t.t === 'spend' && t.acct === 'fun')],
    ['Given to charity', tot(t => t.t === 'spend' && t.acct === 'charity')],
    ['Used from emergency fund', tot(t => t.t === 'spend' && t.acct === 'salary')],
    ['Withdrawn from savings', tot(t => t.t === 'spend' && t.acct === 'savings')],
    ['Net change in savings', legSum('savings')],
    ['Net change in emergency fund', legSum('salary')],
  ];
  return `<section class="card"><div class="card-h"><h2>Year summary</h2><div class="chips">${years.map(y => `<button class="chip" data-act="year" data-v="${y}" aria-pressed="${y === yr}">${y}</button>`).join('')}</div></div>
    <div class="tbl-wrap"><table class="tbl"><tbody>${rows.map(r => `<tr><td>${r[0]}</td><td>${fmt(r[1])}</td></tr>`).join('')}</tbody></table></div>
    ${catRows ? `<div class="eyebrow" style="margin:16px 0 4px">Expense spending by category, ${yr}</div><div class="tbl-wrap"><table class="tbl"><tbody>${catRows}</tbody></table></div>` : ''}</section>`;
}

/* ================= sheets & modal ================= */
let SHEET = null, MODAL = null;
function openSheet(type, d) { SHEET = { type, d }; document.body.classList.add('locked'); renderSheet(); const b = $('.sheet-b'); if (b) b.scrollTop = 0; }
function closeSheet() { SHEET = null; const el = $('#sheet'); el.hidden = true; el.innerHTML = ''; document.body.classList.remove('locked'); }
function renderSheet() {
  if (!SHEET) return;
  const el = $('#sheet'); const old = el.querySelector('.sheet-b'); const top = old ? old.scrollTop : 0;
  const fn = SHEETS[SHEET.type]; if (!fn) return closeSheet();
  el.innerHTML = fn(SHEET.d); el.hidden = false;
  const nb = el.querySelector('.sheet-b'); if (nb) nb.scrollTop = top;
  if (SHEET.d && SHEET.d._after) SHEET.d._after();
}
function frame({ title, body, foot, steps, step, back }) {
  return `<div class="sheet-h"><div class="wrap bar">${back ? `<button class="back" data-act="sheetBack" aria-label="Back">${I.back}</button>` : ''}<h2>${esc(title)}</h2><button class="back" data-act="closeSheet" aria-label="Close">${I.close}</button></div>
  ${steps ? `<div class="wrap" style="padding-bottom:12px"><div class="steps">${steps.map((s, i) => `<span class="${i <= step ? 'on' : ''}" title="${esc(s)}"></span>`).join('')}</div><div class="eyebrow" style="margin-top:8px">Step ${step + 1} of ${steps.length} · ${esc(steps[step])}</div></div>` : ''}</div>
  <div class="sheet-b"><div class="wrap">${body}</div></div>${foot ? `<div class="sheet-f"><div class="wrap">${foot}</div></div>` : ''}`;
}
function confirmBox({ title, body = '', ok = 'Confirm', cancel = 'Cancel', danger = false, onOk, onCancel }) {
  MODAL = { onOk, onCancel };
  const m = $('#modal');
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${body ? `<div class="ink2">${body}</div>` : ''}<div class="btn-row">${cancel ? `<button class="btn" data-act="modalCancel">${esc(cancel)}</button>` : ''}<button class="btn ${danger ? 'danger' : 'primary'}" data-act="modalOk">${esc(ok)}</button></div></div>`;
  m.hidden = false;
}
function closeModal() { MODAL = null; $('#modal').hidden = true; $('#modal').innerHTML = ''; }
let toastTimer = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600); }
function setPath(o, path, v) { const p = path.split('.'); let cur = o; for (let i = 0; i < p.length - 1; i++) { if (cur[p[i]] == null || typeof cur[p[i]] !== 'object') cur[p[i]] = {}; cur = cur[p[i]]; } cur[p[p.length - 1]] = v; }
const chip = (act, path, val, cur, label, color) => `<button class="chip" data-act="${act}" data-bind="${path}" data-val="${esc(val)}" aria-pressed="${cur === val}">${color ? `<span class="dot" style="background:${color}"></span>` : ''}${esc(label)}</button>`;
const amountField = (path, val, id = 'amt') => `<div class="amount-big"><span class="cur">AED</span><input id="${id}" inputmode="decimal" autocomplete="off" placeholder="0" data-bind="${path}" value="${esc(val)}" aria-label="Amount"></div>`;
const inputField = (label, path, val, opts = {}) => `<div class="field"><label for="f-${path}">${label}</label><input class="inp ${opts.money ? 'money' : ''}" id="f-${path}" ${opts.money ? 'inputmode="decimal"' : ''} ${opts.type ? `type="${opts.type}"` : ''} data-bind="${path}" value="${esc(val ?? '')}" placeholder="${esc(opts.ph || '')}"></div>`;

const SHEETS = {};

/* ---------- quick add / edit transaction ---------- */
function addDraft(mode = 'spend', acct) {
  const firstCat = activeCats()[0];
  const d = { mode, a: '', d: today(), note: '', acct: acct || 'expense', pick: firstCat ? 'cat:' + firstCat.id : 'oneoff', inKind: 'income', inAcct: acct && acct !== 'salary' ? acct : 'expense', inB: '', fa: 'salary', fb: 'main', ta: 'expense', tb: 'oneoff', saveShort: false };
  if (mode === 'income') { d.mode = 'in'; d.inKind = 'income'; d.note = 'Commission'; }
  if (mode === 'in') { d.inKind = acct === 'salary' ? 'income' : 'other'; d.inB = defaultBucket(d.inAcct); }
  if (mode === 'move' && acct) { d.fa = acct; d.fb = defaultBucket(acct); d.ta = acct === 'salary' ? 'savings' : 'salary'; d.tb = defaultBucket(d.ta); }
  if (mode === 'spend' && acct) { d.acct = acct; if (acct === 'savings') d.pick = 'general'; }
  if (!d.inB) d.inB = defaultBucket(d.inAcct);
  return d;
}
function bucketChips(act, path, acct, cur) {
  const bs = bucketsFor(acct); if (bs.length < 2) return '';
  return `<div class="field"><span class="lbl">${acct === 'expense' ? 'Part of the Expense account' : 'Part of Savings'}</span><div class="chips">${bs.map(b => chip(act, path, b, cur, bucketLabel(acct, b))).join('')}</div></div>`;
}
const acctChips = (path, cur, exclude) => `<div class="chips">${ACCTS.filter(a => a.k !== exclude).map(a => chip('pick', path, a.k, cur, a.name, a.color)).join('')}</div>`;
SHEETS.add = d => {
  const editing = !!d.editId;
  const tabs = editing ? '' : `<div class="tabs">${['spend', 'in', 'move'].map(m => `<button data-act="pick" data-bind="mode" data-val="${m}" aria-pressed="${d.mode === m}">${{ spend: 'Spending', in: 'Money in', move: 'Move' }[m]}</button>`).join('')}</div>`;
  let body = tabs;
  if (d.mode === 'spend') {
    const shorts = !editing && S.settings.shortcuts.length ? `<div class="field"><span class="lbl">Shortcuts</span><div class="chips">${S.settings.shortcuts.map(s => `<button class="chip" data-act="useShortcut" data-id="${s.id}">${esc(s.label)}</button>`).join('')}</div></div>` : '';
    let where = '';
    if (d.acct === 'expense') {
      where = `<div class="field"><span class="lbl">Category</span><div class="chips">${activeCats().map(c => chip('pick', 'pick', 'cat:' + c.id, d.pick, c.name)).join('')}</div></div>
      <div class="field"><span class="lbl">Or pay from a pot</span><div class="chips">${['oneoff', ...activePots().map(p => 'pot:' + p.id)].map(b => chip('pick', 'pick', b, d.pick, bucketLabel('expense', b))).join('')}</div></div>`;
    } else if (d.acct === 'savings') where = bucketChips('pick', 'pick', 'savings', d.pick);
    body += shorts + amountField('a', d.a) + `<div class="field"><span class="lbl">From account</span>${acctChips('acct', d.acct)}</div>` + where +
      `<div class="grid2">${inputField('Date', 'd', d.d, { type: 'date' })}${inputField(d.acct === 'salary' || d.acct === 'savings' ? 'Reason' : 'Note', 'note', d.note, { ph: d.acct === 'charity' ? 'Who or what' : 'Optional' })}</div>` +
      (editing ? '' : `<label style="display:flex;gap:10px;align-items:center;font-weight:600"><input type="checkbox" data-bind="saveShort" ${d.saveShort ? 'checked' : ''} style="width:20px;height:20px"> Save as a shortcut</label>`);
  } else if (d.mode === 'in') {
    body += (editing ? '' : `<div class="chips">${chip('pick', 'inKind', 'income', d.inKind, 'Commission or income')}${chip('pick', 'inKind', 'other', d.inKind, 'Refund, cashback or interest')}</div>`) + amountField('a', d.a);
    if (d.inKind === 'income') body += `<p class="callout">Income lands in your ${esc(AN.salary.name)} account (${esc(bankOf('salary'))}) and counts toward this cycle.</p>`;
    else body += `<div class="field"><span class="lbl">Into account</span>${acctChips('inAcct', d.inAcct)}</div>` + bucketChips('pick', 'inB', d.inAcct, d.inB);
    body += `<div class="grid2">${inputField('Date', 'd', d.d, { type: 'date' })}${inputField('Note', 'note', d.note, { ph: 'Optional' })}</div>`;
  } else {
    body += amountField('a', d.a) + `<div class="field"><span class="lbl">From</span>${acctChips('fa', d.fa)}</div>${bucketChips('pick', 'fb', d.fa, d.fb)}<div class="field"><span class="lbl">To</span>${acctChips('ta', d.ta)}</div>${bucketChips('pick', 'tb', d.ta, d.tb)}<div class="grid2">${inputField('Date', 'd', d.d, { type: 'date' })}${inputField('Note', 'note', d.note, { ph: 'Optional' })}</div>`;
  }
  const foot = `<div class="btn-row">${editing ? `<button class="btn" data-act="delTx" style="color:var(--bad-ink)">Delete</button>` : ''}<button class="btn primary" data-act="saveAdd">${editing ? 'Save changes' : 'Save'}</button></div>`;
  return frame({ title: editing ? 'Edit transaction' : 'Add', body, foot });
};
function saveAdd() {
  const d = SHEET.d; const a = num(d.a);
  if (a <= 0) { toast('Enter an amount above zero.'); return; }
  let t;
  const base = { a, d: d.d || today(), note: (d.note || '').trim() };
  if (d.mode === 'spend') {
    t = { ...base, t: 'spend', acct: d.acct };
    if (d.acct === 'expense') { if (d.pick.startsWith('cat:')) { t.b = 'spend'; t.cat = d.pick.slice(4); } else t.b = bucketsFor('expense').includes(d.pick) ? d.pick : 'oneoff'; }
    else if (d.acct === 'savings') t.b = bucketsFor('savings').includes(d.pick) ? d.pick : 'general';
    else t.b = 'main';
  } else if (d.mode === 'in') {
    if (d.inKind === 'income') t = { ...base, t: 'income' };
    else t = { ...base, t: 'in', acct: d.inAcct, b: bucketsFor(d.inAcct).includes(d.inB) ? d.inB : defaultBucket(d.inAcct) };
  } else {
    const fb = bucketsFor(d.fa).includes(d.fb) ? d.fb : defaultBucket(d.fa), tb = bucketsFor(d.ta).includes(d.tb) ? d.tb : defaultBucket(d.ta);
    if (d.fa === d.ta && fb === tb) { toast('Pick a different place to move the money to.'); return; }
    t = { ...base, t: 'move', fa: d.fa, fb, ta: d.ta, tb };
  }
  if (d.editId) {
    const f = findTx(d.editId); if (!f) return closeSheet();
    const keep = { id: f.t.id, ts: f.t.ts };
    const i = f.c.txns.indexOf(f.t); f.c.txns[i] = { ...t, ...keep }; saveCycle(f.c);
  } else {
    let c = openCycle(); if (!c) { c = newCycle(cyclesAsc().length + 1); }
    addTx(c, t);
    if (d.saveShort && d.mode === 'spend') {
      S.settings.shortcuts.push({ id: newId(), label: t.note || txTitle(t), acct: t.acct, pick: d.acct === 'expense' ? d.pick : t.b, amount: a });
      saveSettings();
    }
  }
  closeSheet(); toast(d.editId ? 'Changes saved' : 'Saved'); renderApp();
}
function openEditTx(id) {
  const f = findTx(id); if (!f) return;
  const t = f.t;
  if (t.t === 'xfer') return openSheet('xfer', { key: t.key, cid: f.c.id, a: String(t.a), d: t.d });
  if (t.t === 'adj') return openSheet('adj', { id: t.id, a: String(t.a), acct: t.acct });
  if (t.t === 'move' && t.sys) return confirmBox({ title: txTitle(t), body: `${plain(t.a)} on ${fdate(t.d)}. This was done automatically and can’t be edited.`, ok: 'OK', cancel: '' });
  const d = addDraft(t.t === 'spend' ? 'spend' : t.t === 'move' ? 'move' : 'in');
  Object.assign(d, { editId: t.id, a: String(t.a), d: t.d, note: t.note || '' });
  if (t.t === 'spend') { d.acct = t.acct; d.pick = t.acct === 'expense' ? ((t.b || 'spend') === 'spend' ? 'cat:' + t.cat : t.b) : t.b; }
  if (t.t === 'income') d.inKind = 'income';
  if (t.t === 'in') { d.inKind = 'other'; d.inAcct = t.acct; d.inB = t.b; }
  if (t.t === 'move') Object.assign(d, { fa: t.fa, fb: t.fb, ta: t.ta, tb: t.tb });
  openSheet('add', d);
}

};
function saveXfer() {
  const d = SHEET.d, c = S.cycles[d.cid]; const a = num(d.a);
  if (a <= 0) { toast('Enter the amount you transferred.'); return; }
  const t = xferOf(c, d.key);
  if (t) { t.a = a; t.d = d.d || today(); saveCycle(c); }
  else addTx(c, { t: 'xfer', key: d.key, a, d: d.d || today() });
  closeSheet(); toast(t ? 'Updated' : 'Marked as done'); renderApp();
}

SHEETS.bal = d => {
  const exp = acctTotal(d.acct);
  const body = `<p class="ink2">${d.acct === 'charity' ? 'Count the cash in your locker' : 'Open your ' + esc(bankOf(d.acct) || 'banking') + ' app'} and enter the real balance. If it doesn’t match, Cycle Ledger adds an adjustment so the two agree.</p>
