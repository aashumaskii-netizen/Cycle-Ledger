    <div class="field"><span class="lbl">Real balance</span>${amountField('a', d.a)}</div><div id="bal-diff" class="callout"></div>
    ${d.acct === 'expense' ? '<p class="hint">Any difference is applied to the one-off pot.</p>' : d.acct === 'savings' ? '<p class="hint">Any difference is applied to general savings.</p>' : ''}`;
  d._after = () => updateBalDiff();
  return frame({ title: 'Check ' + AN[d.acct].name, body, foot: `<button class="btn primary block" data-act="saveBal">Save</button>` });
};
function updateBalDiff() {
  const d = SHEET.d, el = $('#bal-diff'); if (!el) return;
  if (d.a === '' || d.a == null) { el.textContent = 'Enter the balance to compare.'; return; }
  const diff = r2(num(d.a) - acctTotal(d.acct));
  el.textContent = diff === 0 ? 'Matches. Nothing to adjust.' : `Off by ${plain(Math.abs(diff))}. An adjustment of ${diff > 0 ? '+' : '−'}${plain(Math.abs(diff))} will be added.`;
}
function saveBal() {
  const d = SHEET.d; if (d.a === '' || d.a == null) { toast('Enter the real balance.'); return; }
  const diff = r2(num(d.a) - acctTotal(d.acct));
  if (diff) addTx(openCycle(), { t: 'adj', acct: d.acct, b: adjBucket(d.acct), a: diff, d: today(), note: 'Balance check' });
  closeSheet(); toast(diff ? 'Adjusted to match' : 'Balance matches'); renderApp();
}
SHEETS.adj = d => frame({ title: 'Balance adjustment', body: `<p class="ink2">Added during a balance check on ${esc(AN[d.acct].name)}. Use a minus sign for money that was missing.</p><div class="field"><span class="lbl">Adjustment (AED)</span><input class="inp money" inputmode="decimal" data-bind="a" value="${esc(d.a)}"></div>`, foot: `<div class="btn-row"><button class="btn" data-act="delTx" style="color:var(--bad-ink)">Delete</button><button class="btn primary" data-act="saveAdj">Save</button></div>` });

/* ---------- start / edit plan ---------- */
const PLAN_STEPS = ['Income', 'Expenses', 'Annual pots', 'Allocate'];
function planDraft() {
  const c = openCycle(); const prev = lastPlannedCycle(c.id);
  const s = v => (v ? String(v) : '');
  const budget = {}, potPlan = {}, goals = {};
  activeCats().forEach(cat => budget[cat.id] = s(c.planned ? (c.budget || {})[cat.id] : prev && (prev.budget || {})[cat.id]));
  if (c.planned) Object.keys(c.budget || {}).forEach(id => { if (!(id in budget) && +c.budget[id]) budget[id] = s(c.budget[id]); });
  activePots().forEach(p => potPlan[p.id] = s(c.planned ? (c.potPlan || {})[p.id] : prev && (prev.potPlan || {})[p.id]));
  const src = c.planned ? c.plan : (prev ? prev.plan : {}) || {};
  activeGoals().forEach(g => goals[g.id] = s((src.goals || {})[g.id]));
  return { step: c.planned ? 3 : 0, cid: c.id, budget, potPlan, plan: { oneoff: s(src.oneoff), general: s(src.general), goals, charity: s(src.charity), fun: s(src.fun), emergency: s(src.emergency) }, inc: { a: '', d: today(), note: 'Commission' }, newCat: '', newPot: { name: '', target: '' } };
}
const dBudget = d => sum(Object.values(d.budget).map(num));
const dPots = d => sum(Object.values(d.potPlan).map(num));
const dSavings = d => r2(num(d.plan.general) + sum(Object.values(d.plan.goals).map(num)));
const dExpense = d => r2(dBudget(d) + dPots(d) + num(d.plan.oneoff));
const dAllocated = d => r2(dExpense(d) + dSavings(d) + num(d.plan.charity) + num(d.plan.fun) + num(d.plan.emergency));

    foot = `<div class="counter" id="pl-counter"></div>` + nav('planConfirm', c.planned ? 'Save plan' : 'Confirm plan');

};
function updatePlanCounters() {

  set('pl-budget', plain(dBudget(d))); set('pl-pots', plain(dPots(d))); set('pl-exp', plain(dExpense(d)));
  const el = $('#pl-counter'); if (!el) return;
  const left = r2(incomeOf(S.cycles[d.cid]) - dAllocated(d));

  el.innerHTML = `<span>${left === 0 ? 'Every dirham has a job' : left > 0 ? 'Left to allocate' : 'Over-allocated by'}</span><span class="amt">${left === 0 ? I.check : plain(Math.abs(left))}</span>`;
}
function planConfirm() {

  c.budget = pos(d.budget); c.potPlan = pos(d.potPlan);
  c.plan = { oneoff: num(d.plan.oneoff), general: num(d.plan.general), goals: pos(d.plan.goals), charity: num(d.plan.charity), fun: num(d.plan.fun), emergency: num(d.plan.emergency) };

/* ---------- close cycle ---------- */
const CLOSE_STEPS = ['Balance check', 'Summary', 'Carry forward'];
SHEETS.close = d => {

      ${pending.length ? `<div class="alert">${I.warn}<span>${pending.length} transfer${pending.length > 1 ? 's are' : ' is'} not marked as done: ${pending.map(k => AN[k].name).join(', ')}.</span></div>` : ''}
      ${ACCTS.map(a => `<div class="card" style="padding:12px 14px;display:flex;flex-direction:column;gap:8px">
        <div class="acct-head" style="justify-content:space-between"><span style="display:flex;gap:8px;align-items:center;min-width:0"><span class="dot" style="background:${a.color}"></span><b>${a.name}</b></span><span class="sub">${esc(bankOf(a.k))}</span></div>

    d._after = null;
  } else {
    const adj = closeAdjustments(d);
    const spendLeft = bucketBal('expense', 'spend');
    const funLeft = r2(acctTotal('fun') + (adj.fun || 0));
    body = `<p class="ink2">Here’s what happens when you close cycle ${c.n}.</p><div class="card">
      ${Object.entries(adj).filter(([, v]) => v).map(([k, v]) => `<div class="kv"><span>${AN[k].name} adjusted to match the bank</span><b>${v > 0 ? '+' : '−'}${plain(Math.abs(v))}</b></div>`).join('')}
      <div class="kv"><span>${spendLeft >= 0 ? 'Unspent expense money moves to the one-off pot' : 'Overspend is covered by the one-off pot'}</span><b>${plain(Math.abs(spendLeft))}</b></div>
      <div class="kv"><span>Fun Allowance left rolls into next cycle</span><b>${plain(funLeft)}</b></div>
      <div class="kv"><span>Annual pots, savings and emergency fund</span><b>Carry over</b></div></div>
      <p class="hint">Cycle ${c.n + 1} opens straight away. You can start it now or when your next commission lands.</p>`;
    foot = `<div class="btn-row"><button class="btn" data-act="closeStep" data-v="1">Back</button><button class="btn primary" data-act="closeConfirm">Close cycle ${c.n}</button></div>`;
    d._after = null;
  }
  return frame({ title: `Close cycle ${c.n}`, body, foot, steps: CLOSE_STEPS, step: d.step });
};
function closeAdjustments(d) {
  const out = {};
  for (const a of ACCTS) { const v = d.actual[a.k]; if (v === '' || v == null) continue; out[a.k] = r2(num(v) - acctTotal(a.k)); }
  return out;
}
function updateCloseDiffs() {
  const d = SHEET && SHEET.d; if (!d || SHEET.type !== 'close') return;
  for (const a of ACCTS) {
    const el = $('#cl-diff-' + a.k); if (!el) continue;
    const v = d.actual[a.k];
    if (v === '' || v == null) { el.textContent = 'Not checked'; el.style.color = ''; continue; }
    const diff = r2(num(v) - acctTotal(a.k));
    el.textContent = diff === 0 ? '✓ Matches' : `${plain(Math.abs(diff))} ${diff > 0 ? 'more' : 'less'} than expected`;
    el.style.color = diff === 0 ? 'var(--good-ink)' : 'var(--warn-ink)';
  }
}
function closeCycleCore(c, adj, date) {
  date = date || today();
  for (const [k, v] of Object.entries(adj || {})) if (v) c.txns.push({ id: newId(), ts: Date.now(), t: 'adj', acct: k, b: adjBucket(k), a: v, d: date, note: 'Balance check' });
  S.ver++;
  const spendLeft = bucketBal('expense', 'spend');
  if (spendLeft) c.txns.push({ id: newId(), ts: Date.now(), t: 'move', sys: true, fa: 'expense', fb: 'spend', ta: 'expense', tb: 'oneoff', a: spendLeft, d: date, note: spendLeft > 0 ? `Unspent expense money from cycle ${c.n}` : `Cycle ${c.n} overspend covered by one-off pot` });
  c.status = 'closed'; c.end = date; c.close = { date, adj: adj || {} };
  saveCycle(c);
  const n = newCycle(c.n + 1, date); saveCycle(n);
  return n;
}
function closeConfirm() {
  const d = SHEET.d, c = S.cycles[d.cid];
  const n = closeCycleCore(c, closeAdjustments(d));
  closeSheet(); S.view = 'home'; renderApp(); window.scrollTo(0, 0);
  confirmBox({ title: `Cycle ${c.n} closed`, body: `Cycle ${n.n} is open. Start it now if your commission has landed, or later from Home.`, ok: `Start cycle ${n.n}`, cancel: 'Later', onOk: () => openSheet('plan', planDraft()) });
}

/* ---------- pots & goals ---------- */
function closeBucket(kind, id) {
  const isPot = kind === 'pot'; const acct = isPot ? 'expense' : 'savings'; const b = (isPot ? 'pot:' : 'goal:') + id; const to = isPot ? 'oneoff' : 'general';
  const item = (isPot ? S.settings.pots : S.settings.goals).find(x => x.id === id); if (!item) return;
  const c = openCycle();
  if (c) {
    if (isPot && c.potPlan && c.potPlan[id] && !xferOf(c, 'expense')) delete c.potPlan[id];
    if (!isPot && c.plan && c.plan.goals && c.plan.goals[id] && !xferOf(c, 'savings')) delete c.plan.goals[id];
    S.ver++;
    const bal = bucketBal(acct, b);
    if (bal) c.txns.push({ id: newId(), ts: Date.now(), t: 'move', sys: true, fa: acct, fb: b, ta: acct, tb: to, a: bal, d: today(), note: `Closed ${isPot ? 'pot' : 'goal'}: ${item.name}` });
    saveCycle(c);
  }
  item.closed = true; saveSettings(); renderApp();
  toast(`${item.name} closed`);
}

/* ================= export, backup, restore ================= */
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
let _xlsxLoading = null;
function ensureXlsx() { if (window.XLSX) return Promise.resolve(); if (!_xlsxLoading) _xlsxLoading = loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js').catch(e => { _xlsxLoading = null; throw e; }); return _xlsxLoading; }
async function saveFile(filename, data, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  let file = null; try { file = new File([blob], filename, { type }); } catch (e) { }
  const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
  if (file && mobile && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return true; }
    catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  try {
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000); toast('Downloaded ' + filename); return true;
  } catch (e) { toast('Couldn’t create the file on this device.'); return false; }
}
async function exportXlsx() {
  const tx = allTxns().slice().reverse().map(({ t, c }) => ({
    Cycle: c.n, Date: t.d, Type: { income: 'Income', in: 'Money in', spend: 'Spending', xfer: 'Transfer', move: 'Move', adj: 'Adjustment' }[t.t],
    Description: txTitle(t),
    Account: t.t === 'xfer' ? AN.salary.name + ' → ' + AN[t.key].name : t.t === 'move' ? AN[t.fa].name + ' → ' + AN[t.ta].name : t.t === 'income' ? AN.salary.name : AN[t.acct] ? AN[t.acct].name : '',
    Detail: t.t === 'spend' || t.t === 'in' || t.t === 'adj' ? bucketLabel(t.acct, t.b || defaultBucket(t.acct)) : t.t === 'move' ? bucketLabel(t.fa, t.fb) + ' → ' + bucketLabel(t.ta, t.tb) : '',
    Amount: t.t === 'spend' ? -t.a : t.a, Note: t.note || '' }));
  const cyc = calc().snaps.map(s => ({ Cycle: s.c.n, Start: s.c.start, End: s.c.end || 'open', Earned: s.income, Allocated: s.c.planned ? plannedTotal(s.c) : 0, 'Expense spending': s.spent.expense, 'Fun spending': s.spent.fun, 'Given to charity': s.spent.charity, 'Emergency fund at end': s.end.salary, 'Savings at end': s.end.savings, 'Total at end (excl. charity)': endTotal(s) }));
  const bal = ACCTS.map(a => ({ Account: a.name, 'Bank or card': bankOf(a.k), Balance: acctTotal(a.k) }));
  const stamp = today();
  try {
    await ensureXlsx();
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bal), 'Balances');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cyc), 'Cycles');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tx), 'Transactions');
    const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    await saveFile(`cycle-ledger-${stamp}.xlsx`, out, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  } catch (e) {
    const cols = Object.keys(tx[0] || { Cycle: 0 });
    const csv = [cols.join(',')].concat(tx.map(r => cols.map(c => `"${String(r[c] ?? '').replace(/"/g, '""')}"`).join(','))).join('\n');
    await saveFile(`cycle-ledger-${stamp}.csv`, csv, 'text/csv');
  }
}
async function backup() {
  const data = JSON.stringify({ app: 'cycle-ledger', v: 1, exported: new Date().toISOString(), settings: S.settings, cycles: cyclesAsc() }, null, 1);
  const ok = await saveFile(`cycle-ledger-backup-${today()}.json`, data, 'application/json');
  if (ok && S.mode === 'live') { S.settings.lastBackup = today(); saveSettings(); renderMain(); toast('Backup saved'); }
}
function restoreFrom(file) {
  if (S.mode !== 'live') { toast('Exit the example first.'); return; }
  const r = new FileReader();
  r.onload = () => {
    let o; try { o = JSON.parse(r.result); } catch (e) { toast('That file isn’t a Cycle Ledger backup.'); return; }
    if (!o || o.app !== 'cycle-ledger' || !o.settings || !Array.isArray(o.cycles)) { toast('That file isn’t a Cycle Ledger backup.'); return; }
    confirmBox({ title: 'Restore this backup?', body: `It replaces everything with the backup from ${esc(fdate((o.exported || '').slice(0, 10)))} (${o.cycles.length} cycles).`, ok: 'Restore', danger: true, onOk: () => {
      const keep = new Set(o.cycles.map(c => c.id));
      for (const id of Object.keys(S.cycles)) if (!keep.has(id)) deleteCycleDoc(id);
      S.settings = o.settings; saveSettings();
      for (const c of o.cycles) saveCycle(c);
      S.view = 'home'; renderApp(); toast('Backup restored');
    } });
  };
  r.readAsText(file);
}

  let c = newCycle(1, day(0, 1)); S.cycles[c.id] = c;
  const funNotes = ['Dinner at JBR', 'Cinema', 'Brunch', 'Padel booking', 'Gaming', 'Shisha with friends', 'Concert tickets', 'New trainers'];
  const charityNotes = ['Mosque donation', 'Red Crescent', 'Friday giving', 'Food bank'];
  for (let i = 0; i < 5; i++) {

    const goals = { [gCar]: i === 2 ? 0 : 1500, [gTrip]: 600 };
    const general = i === 2 ? 0 : Math.round(inc * 0.12 / 100) * 100;
    const expense = 4690 + 6520 + 300;
    const emergency = Math.max(0, inc - expense - general - goals[gCar] - goals[gTrip] - charity - fun);
    c.plan = { oneoff: 300, general, goals: Object.fromEntries(Object.entries(goals).filter(([, v]) => v)), charity, fun, emergency };
    c.planned = true; c.plannedAt = day(m, 2);
    const open = i === 4;
    for (const k of XKEYS) { if (open && (k === 'charity' || k === 'fun')) continue; const p = plannedFor(c, k); if (p) c.txns.push({ id: newId(), ts: 2, t: 'xfer', key: k, a: k === 'expense' && i === 1 ? p - 200 : p, d: day(m, 3) }); }
    const days = open ? Math.max(1, new Date().getDate() - 3) : 27;

    const f = open ? 0.35 : 1;

    for (let j = 0; j < Math.round(6 * f); j++) c.txns.push({ id: newId(), ts: 4, t: 'spend', acct: 'fun', b: 'main', a: Math.round(80 + rnd() * 380), d: day(m, 4 + Math.floor(rnd() * days)), note: funNotes[Math.floor(rnd() * funNotes.length)] });

/* ================= events & boot ================= */
function showTip(el, x, y) {
  const tip = $('#tip'); tip.textContent = el.getAttribute('data-tip'); tip.hidden = false;
  const r = tip.getBoundingClientRect(); const W = window.innerWidth;
  tip.style.left = Math.max(8, Math.min(W - r.width - 8, x - r.width / 2)) + 'px';
  tip.style.top = Math.max(8, y - r.height - 14) + 'px';
}
const hideTip = () => { $('#tip').hidden = true; };
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled) { hideTip(); const f = ACT[a.dataset.act]; if (f) { e.preventDefault(); f(a, e); } return; }
  const t = e.target.closest('[data-tip]');
  if (t) showTip(t, e.clientX, e.clientY); else hideTip();
});
document.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t, e.clientX, e.clientY); else hideTip(); });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind && SHEET && $('#sheet').contains(el)) {
    setPath(SHEET.d, el.dataset.bind, el.type === 'checkbox' ? el.checked : el.value);
    if (SHEET.type === 'plan') updatePlanCounters();
    if (SHEET.type === 'close') updateCloseDiffs();
    if (SHEET.type === 'bal') updateBalDiff();
    return;
  }
  if (el.dataset.setup && SETUP) { const p = el.dataset.setup; setPath(SETUP, p, /start|low|Target/.test(p) ? num(el.value) : el.value); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.set && S.settings) { setPath(S.settings, el.dataset.set, el.dataset.num ? num(el.value) : el.value.trim()); saveSettings(); renderTop(); toast('Saved'); }
  if (el.dataset.cat && S.settings) { const c = S.settings.categories.find(x => x.id === el.dataset.cat); const v = el.value.trim(); if (c && v) { c.name = v; saveSettings(); toast('Saved'); } }
  if (el.id === 'restoreFile' && el.files && el.files[0]) { restoreFrom(el.files[0]); el.value = ''; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (MODAL) closeModal(); else if (SHEET) closeSheet(); }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('input') && SHEET && SHEET.type === 'add') { e.preventDefault(); saveAdd(); }
});
/* don't yank inputs out from under the user when the store echoes a save */
const _renderMain = renderMain;
renderMain = function () { const ae = document.activeElement; if (S.mode === 'live' && ae && ae.tagName === 'INPUT' && $('#main').contains(ae) && renderMain._fromSnap) return; _renderMain(); };
const _renderApp = renderApp;
renderApp = function (fromSnap) { renderMain._fromSnap = !!fromSnap; try { _renderApp(fromSnap); } finally { renderMain._fromSnap = false; } };

(function boot() {
  const ok = Store.init();
  if (!ok) { S.mode = 'offline'; renderApp(); }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
})();
